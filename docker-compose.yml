version: '3.8'

services:
  agrivoice-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LLM_BACKEND=${LLM_BACKEND}
      - OLLAMA_URL=${OLLAMA_URL}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN}
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
